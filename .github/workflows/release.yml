name: release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/card-build/package-lock.json

      - name: Install deps
        run: |
          npm ci
          npm --prefix tools/card-build ci --omit=dev

      - name: Build module zip
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p = JSON.parse(fs.readFileSync('package.json')); if ('v' + p.version !== process.env.RELEASE_TAG) throw new Error('Tag and package version differ');"
          npm test
          node scripts/build-home-assets.mjs
          node scripts/build-bridge.mjs
          node scripts/build-module.mjs
          node tools/card-build/bin/card-build.js dist/module "dist/rear-card-hoyolab-${RELEASE_TAG#v}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rear-card-hoyolab-*.zip
          body_path: RELEASE.md
          generate_release_notes: false

      - name: Check module shop credentials
        env:
          MODULE_STORE_TOKEN: ${{ secrets.MODULE_STORE_TOKEN }}
        run: |
          test -n "$MODULE_STORE_TOKEN" || { echo "::error::Set MODULE_STORE_TOKEN with Contents read/write access to finall1008/rear-card-modules"; exit 1; }

      - name: Checkout module shop publisher
        uses: actions/checkout@v4
        with:
          repository: finall1008/rear-card-modules
          ref: main
          path: _module-store
          token: ${{ secrets.MODULE_STORE_TOKEN }}
          persist-credentials: false

      - name: Update module shop
        env:
          MODULE_STORE_TOKEN: ${{ secrets.MODULE_STORE_TOKEN }}
        run: |
          python3 _module-store/scripts/publish-module.py \
            "dist/rear-card-hoyolab-${RELEASE_TAG#v}.zip" \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
